include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/blocks/workflow.yml
      - /gitlab-templates/reuse-lint.yml
      - /gitlab-templates/json-validation.yml
      - /gitlab-templates/yaml-lint.yml

# native 侧回归门禁（全 Rust 原生栈）。C++/BearSSL 已删除 ⇒ 不再 include clang-format。
# 本地产物等价：entry/src/main/cpp/tests/run.sh（含 fmt/clippy + 两道契约门禁 + e2e）。
native-core-test:
  stage: validate
  image: rust:latest
  tags: [Linux]
  script:
    # kdc_core：纯逻辑 crate 的单测（含契约黄金用例）
    - cargo test --manifest-path entry/src/main/cpp/rust/kdc_core/Cargo.toml
    # kdc_native：核心 lib + 契约测试 + 双栈 E2E（含二次 identity / 未配对门禁 / panic 包裹）
    - cargo test --manifest-path entry/src/main/cpp/rust/full/Cargo.toml -p kdc_native
    # 格式与 lint（与 run.sh 同口径）
    - cargo fmt --manifest-path entry/src/main/cpp/rust/full/Cargo.toml --all -- --check
    - cargo clippy --manifest-path entry/src/main/cpp/rust/full/Cargo.toml --workspace --all-targets -- -D warnings
