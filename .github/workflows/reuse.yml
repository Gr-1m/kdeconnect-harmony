# SPDX-License-Identifier: GPL-2.0-or-later
# REUSE 合规校验（GitHub 侧生效路径；gitcode 侧同内容放在 .gitcode/workflows/reuse.yml）。
#
# 背景（2026-09-22 实测）：GitHub Actions **只**识别 .github/workflows/**，故仅有 .gitcode/workflows
# 时本仓库 GitHub 镜像上 `total_count = 0`（从未跑过任何 workflow）=> REUSE 校验实际未运行。
# 补本文件后，push 到 GitHub 即会真实执行，KDE 孵化 checklist #12「Passing CI for reuse linting」
# 才有可核验的运行记录。
#
# 本地等价命令：pipx run reuse lint   （或 docker run --rm -v "$PWD:/data" fsfe/reuse:latest lint）
name: reuse

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE lint
        uses: fsfe/reuse-action@v5
