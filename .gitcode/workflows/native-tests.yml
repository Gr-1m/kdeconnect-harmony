# native 侧回归门禁：全 Rust 原生栈（单元 + 双栈 E2E + NAPI 编译检查）。
# 仅需 Rust，**不需要** OHOS 工具链 ⇒ 可在通用 CI runner 上跑。
# 本地等价：cd entry/src/main/cpp/tests && ./run.sh
name: native-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust 单元测试（kdc_core）
        run: cargo test --manifest-path entry/src/main/cpp/rust/kdc_core/Cargo.toml
      - name: 全 Rust native 门禁（unit + stack E2E + NAPI check）
        run: cd entry/src/main/cpp/tests && ./run.sh
