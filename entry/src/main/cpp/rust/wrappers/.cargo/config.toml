# ---------------------------------------------------------------------------
# OpenHarmony cross-compilation config for the `kdc_core` Rust crate.
#
# HOW TO USE (this file is NOT auto-discovered — see below)
# --------------------------------------------------------
# cargo only auto-discovers `.cargo/config.toml` in the crate directory or one
# of its ANCESTORS. This file lives in `rust/wrappers/`, a SIBLING of
# `rust/kdc_core/`, so it must be passed explicitly, and the wrapper directory
# must be on PATH (the `linker` values below are bare command names resolved
# through PATH — see the "whypath" note):
#
#   cd entry/src/main/cpp/rust/kdc_core
#   export PATH="$(cd ../wrappers && pwd):$PATH"
#   cargo build --release --target aarch64-unknown-linux-ohos \
#               --config ../wrappers/.cargo/config.toml
#
# CMake equivalent — NOTE (2026-09-14): CMake no longer uses this file nor the
# wrappers. Its Rust step is now just `cargo build --release --target <triple>`,
# which works on Windows too because a `staticlib` build neither links nor
# spawns an external archiver (rustc 1.98.1 archives in-process; measured: the
# .a is byte-identical with and without AR_*). The wrappers below remain for
# manual cross-link smoke tests (rustc needs a linker only when producing a
# binary/dylib — see ../README.md §5b/§5c).
#
# WHY BARE NAMES (measured, not assumed): cargo does NOT resolve a relative
# `linker` value against this file's directory. Bare names are looked up in
# PATH; values containing a `/` are resolved against a cargo-internal base that
# is neither the cwd nor the config directory (observed:
# `/tmp/kdc-r1-spike/../wrappers/...` for a config at `/tmp/kdc-r1-spike/cfgdir/`
# with cwd `/tmp/kdc-r1-spike/deep/spike`). Bare names + PATH is therefore the
# only relocatable, predictable option — it survives the `/tmp/kdch-scratch`
# repo copy used by MSG93 acceptance #3.
# ---------------------------------------------------------------------------

# --- linkers ---------------------------------------------------------------
# rustc's target specs for *-unknown-linux-ohos use `linker-flavor = "gnu-cc"`,
# so a plain clang driver wrapper is sufficient (no `cc`-style adapter). No `-L`
# is needed for the unwind runtime that rustc's own `-lunwind` pulls in: the
# clang driver emits `-l:libunwind.a` for this target and already searches its
# own runtime dir, where the SDK's only libunwind.a lives (the sysroot has
# none). Measurements are recorded in the wrapper headers.
[target.aarch64-unknown-linux-ohos]
linker = "aarch64-linux-ohos-clang"

[target.x86_64-unknown-linux-ohos]
linker = "x86_64-linux-ohos-clang"

# --- archiver --------------------------------------------------------------
# Deliberately NO `AR_<target>` entry here: measured on rustc 1.98.1, a
# `crate-type = ["staticlib"]` build never spawns an external archiver (a
# logging `AR_aarch64_unknown_linux_ohos` probe was never invoked; the .a is
# written in-process), so such an entry would be dead config.
# `ohos-ar` still exists next to this file for the C/C++ side: point CMake at
# it (CMAKE_AR=<...>/ohos-ar, CMAKE_RANLIB=<...>/ohos-ar) when merging Rust and
# C objects or producing archives inside the OHOS toolchain.
