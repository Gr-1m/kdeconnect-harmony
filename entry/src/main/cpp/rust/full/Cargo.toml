[workspace]
resolver = "2"
members = ["core", "napi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
kdc_core = { path = "../kdc_core" }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
ring = { version = "0.17", default-features = false, features = ["alloc", "dev_urandom_fallback"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
time = "0.3"
libc = "0.2"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = "symbols"
